spring.application.name=campus-connect

# When no profile is chosen, use "dev" (loads application-dev.properties).
# Production sets SPRING_PROFILES_ACTIVE=prod, so the dev passphrases are never used there.
spring.profiles.default=dev

# ---- Development settings (default) ----
# H2 database stored as a file in ./db so data survives restarts (./db is in .gitignore)
spring.datasource.url=jdbc:h2:file:./db/campusconnect
spring.datasource.username=sa
spring.datasource.password=
# Create/update tables automatically from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# H2 web console at /h2-console (development only)
spring.h2.console.enabled=true

# An unlocked group stays unlocked in that browser for up to 8 hours (long enough for an event day)
server.servlet.session.timeout=8h
# Keep the session ID only in a cookie, never in URLs (";jsessionid=..." could leak through shared links)
server.servlet.session.tracking-modes=cookie

# ---- Campus Connect settings ----
# Each group's passphrase is chosen when the group is created and stored as a BCrypt hash.
# Code needed to create a new group, and passphrase for the developer page (/admin).
# Empty = that feature is closed.
app.group-creation-code=${GROUP_CREATION_CODE:}
app.admin-passphrase=${ADMIN_PASSPHRASE:}
# true = refuse to start when the two values above are missing (set in production)
app.require-secrets=false
# Load the sample CSVs in src/main/resources/data when the database is empty
app.load-sample-data=true
# The site is in English: show times like "10:20 PM" even if the browser language is Japanese
spring.web.locale=en_US
spring.web.locale-resolver=fixed
# Event times are recorded in Pacific time, even if the server runs in UTC
app.time-zone=America/Los_Angeles
# Public URL used inside QR codes. Empty = use the URL of the current request.
app.base-url=${APP_BASE_URL:}
