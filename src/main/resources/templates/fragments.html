<!DOCTYPE html>
<!-- Shared pieces reused by every page with th:replace -->
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <!-- Makes the page fit phone screens -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Campus Connect'">Campus Connect</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <!-- Only the Live page sets refreshSeconds: the browser reloads the page by itself -->
    <meta th:if="${refreshSeconds != null}" http-equiv="refresh" th:content="${refreshSeconds}">
</head>

<body>
<!-- Top bar outside a group. Not named "nav": that would also match the <nav> element below -->
<header th:fragment="topNav" class="nav">
    <a th:href="@{/}" class="brand">Campus Connect</a>
    <nav>
        <a th:href="@{/}" class="nav-button">Home</a>
    </nav>
</header>

<!-- Top bar inside an unlocked group: Home, plus links only to this group's pages -->
<header th:fragment="groupNav(group)" class="nav">
    <a th:href="@{/g/{id}(id=${group.groupId})}" class="brand" th:text="${group.groupName}">Group</a>
    <nav>
        <a th:href="@{/}" class="nav-button">Home</a>
        <a th:href="@{/g/{id}(id=${group.groupId})}" class="nav-button">Events</a>
        <a th:href="@{/g/{id}/people(id=${group.groupId})}" class="nav-button">People</a>
        <!-- Shown only on pages of one event (detail, Live, edit): opens that event's Live page -->
        <a th:if="${event != null}" th:href="@{/g/{gid}/events/{eid}/live(gid=${group.groupId},eid=${event.eventId})}"
           class="nav-button live-button">Live</a>
        <a th:href="@{/g/{id}/events/new(id=${group.groupId})}">New event</a>
        <a th:href="@{/g/{id}/attendance-rate(id=${group.groupId})}">Attendance rate</a>
        <form th:action="@{/g/{id}/lock(id=${group.groupId})}" method="post" class="nav-form">
            <button type="submit">Lock</button>
        </form>
    </nav>
</header>

<!-- One event in a list (group page): name, date, location -->
<a th:fragment="eventCard(group, event)" th:href="@{/g/{gid}/events/{eid}(gid=${group.groupId},eid=${event.eventId})}">
    <strong th:text="${event.eventName}">Event name</strong>
    <span class="muted" th:text="${@timeFormat.date(event.eventDate)} + ' · ' + ${event.location}">11/24/2026 · Building A</span>
</a>

<!-- Upcoming list, then Past folded. Used by the group page (per folder) and the folder page -->
<th:block th:fragment="eventLists(group, upcoming, past)">
    <h3>Upcoming (<span th:text="${upcoming.size()}">0</span>)</h3>
    <p th:if="${upcoming.isEmpty()}" class="muted">No upcoming events.</p>
    <ul class="cards">
        <li th:each="event : ${upcoming}">
            <a th:replace="~{fragments :: eventCard(${group}, ${event})}"></a>
        </li>
    </ul>
    <!-- <details> is folded until tapped (no JavaScript needed) -->
    <details class="past">
        <summary>Past (<span th:text="${past.size()}">0</span>)</summary>
        <p th:if="${past.isEmpty()}" class="muted">No past events.</p>
        <ul class="cards">
            <li th:each="event : ${past}">
                <a th:replace="~{fragments :: eventCard(${group}, ${event})}"></a>
            </li>
        </ul>
    </details>
</th:block>
</body>
</html>
