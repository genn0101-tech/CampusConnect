<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Check out everyone')}"></head>
<body>
<header th:replace="~{fragments :: groupNav(${group})}"></header>
<main class="narrow">
    <h1>Check out everyone</h1>
    <p class="event-name" th:text="${event.eventName}">Event name</p>

    <p class="error" th:if="${error}" th:text="${error}">Error</p>

    <p><strong th:text="${stillHere}">12</strong> people have not checked out yet.
        They will all get the time below (Pacific time).</p>

    <form th:action="@{/g/{gid}/events/{eid}/checkout-all(gid=${group.groupId},eid=${event.eventId})}"
          method="post" class="form">
        <input type="hidden" name="from" th:value="${from}">
        <!-- Plain text fields (not the phone's own picker) so the format is always 11/24/2026 and 10:55 PM -->
        <div class="date-time">
            <label>Date
                <input type="text" name="date" required placeholder="11/24/2026"
                       th:value="${@timeFormat.dateOf(time)}">
            </label>
            <label>Time
                <input type="text" name="time" required placeholder="10:55 PM"
                       th:value="${@timeFormat.time(time)}">
            </label>
        </div>
        <p class="small muted">People who checked in after this time are skipped.</p>
        <button type="submit">Check out everyone</button>
    </form>

    <p class="small"><a th:href="${from == 'live'}
            ? @{/g/{gid}/events/{eid}/live(gid=${group.groupId},eid=${event.eventId})}
            : @{/g/{gid}/events/{eid}(gid=${group.groupId},eid=${event.eventId})}">Cancel</a></p>
</main>
</body>
</html>
