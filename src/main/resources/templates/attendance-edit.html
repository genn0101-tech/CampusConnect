<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Fix times')}"></head>
<body>
<header th:replace="~{fragments :: groupNav(${group})}"></header>
<main class="narrow">
    <h1>Fix times</h1>
    <p class="event-name" th:text="${event.eventName}">Event name</p>
    <p th:text="${user != null} ? ${user.name} + ' (' + ${user.displayRole()} + ')' : ${attendance.studentId}">Name (Member)</p>

    <p class="error" th:if="${error}" th:text="${error}">Error</p>

    <form th:action="@{/g/{gid}/events/{eid}/attendance/{aid}/edit(gid=${group.groupId},eid=${event.eventId},aid=${attendance.id})}"
          method="post" class="form">
        <input type="hidden" name="from" th:value="${from}">
        <!-- Plain text fields (not the phone's own picker) so the format is always 11/24/2026 and 10:55 PM -->
        <p class="field-title">Check-in</p>
        <div class="date-time">
            <label>Date
                <input type="text" name="checkInDate" required placeholder="11/24/2026"
                       th:value="${@timeFormat.dateOf(checkIn)}">
            </label>
            <label>Time
                <input type="text" name="checkInTime" required placeholder="10:55 PM"
                       th:value="${@timeFormat.time(checkIn)}">
            </label>
        </div>
        <p class="field-title">Check-out</p>
        <div class="date-time">
            <label>Date
                <input type="text" name="checkOutDate" placeholder="11/24/2026"
                       th:value="${@timeFormat.dateOf(checkOut)}">
            </label>
            <label>Time
                <input type="text" name="checkOutTime" placeholder="10:55 PM"
                       th:value="${@timeFormat.time(checkOut)}">
            </label>
        </div>
        <p class="small muted">Times are Pacific time. Leave both check-out fields empty if the person is still here.
            A changed check-out is saved as "entered by the group" (Out by: Owner).</p>
        <button type="submit">Save</button>
    </form>

    <p class="small"><a th:href="${from == 'live'}
            ? @{/g/{gid}/events/{eid}/live(gid=${group.groupId},eid=${event.eventId})}
            : @{/g/{gid}/events/{eid}(gid=${group.groupId},eid=${event.eventId})}">Cancel</a></p>
</main>
</body>
</html>
