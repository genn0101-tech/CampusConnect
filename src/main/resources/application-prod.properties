# ---- Production settings (activate with SPRING_PROFILES_ACTIVE=prod) ----
# All secrets come from environment variables. Nothing secret is written here.
# Example JDBC_DATABASE_URL: jdbc:postgresql://<host>:5432/<database>
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.h2.console.enabled=false

# Start with an empty database: no sample groups, events, students, or attendance.
# Groups are created on the website with GROUP_CREATION_CODE.
app.load-sample-data=false
# Stop at startup if GROUP_CREATION_CODE or ADMIN_PASSPHRASE is not set
app.require-secrets=true

# Hosting services put the app behind a proxy; this keeps https:// URLs correct in QR codes
server.forward-headers-strategy=framework
server.port=${PORT:8080}
