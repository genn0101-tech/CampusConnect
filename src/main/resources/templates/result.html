<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Done')}"></head>
<body>
<header th:replace="~{fragments :: topNav}"></header>
<main class="narrow">
    <!-- Green box on success, yellow box on "already done" -->
    <div th:class="${success} ? 'result ok' : 'result warn'">
        <h1 th:text="${message}">Checked in.</h1>
        <!-- knownId is only set on check-in pages: "Welcome" there, just the name after check-out -->
        <p th:if="${user != null and knownId != null}">Welcome, <strong th:text="${user.name}">Name</strong>
            <span th:text="'(' + ${user.displayRole()} + ')'">(Member)</span></p>
        <p th:if="${user != null and knownId == null}"
           th:text="${user.name} + ' (' + ${user.displayRole()} + ')'">Name (Member)</p>
    </div>

    <!-- A known Student ID may be someone else's (typo): let the person undo and type it again -->
    <form th:if="${canUndo}" th:action="@{/events/{id}/checkin/not-me(id=${event.eventId})}" method="post"
          class="not-me">
        <span>Not <strong th:text="${user.name}">Name</strong>?</span>
        <button type="submit" class="secondary">Not you? Enter your ID again</button>
    </form>
    <!-- "== true" is safe when knownId is missing (check-out pages do not set it) -->
    <p th:if="${knownId == true and success == false}" class="not-me">
        Not <strong th:text="${user.name}">Name</strong>?
        <a th:href="@{/events/{id}/checkin(id=${event.eventId})}">Enter your Student ID again</a>
    </p>

    <p class="event-name" th:text="${event.eventName}">Event name</p>
    <p>In: <strong th:text="${@timeFormat.dateTime(attendance.checkInTime)}">11/24/2026 3:00 PM</strong></p>
    <p th:if="${attendance.checkOutTime != null}">
        Out: <strong th:text="${@timeFormat.dateTime(attendance.checkOutTime)}">11/24/2026 5:00 PM</strong>
        · Stay: <strong th:text="${attendance.stayMinutes()} + ' min'">120 min</strong>
    </p>

    <!-- After checking in, the next thing the student needs is the check-out page -->
    <p th:if="${attendance.checkOutTime == null}">
        When you leave, scan the exit QR code or tap
        <a th:href="@{/events/{id}/checkout(id=${event.eventId})}">Check out</a>.
    </p>
</main>
</body>
</html>
