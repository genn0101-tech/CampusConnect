<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Developer')}"></head>
<body>
<header th:replace="~{fragments :: topNav}"></header>
<main class="narrow">
    <h1>Developer page</h1>

    <p class="error" th:if="${error}" th:text="${error}">Wrong passphrase.</p>

    <form th:action="@{/admin/login}" method="post" class="form">
        <label>Admin passphrase
            <input type="password" name="passphrase" autocomplete="off" required autofocus>
        </label>
        <button type="submit">Enter</button>
    </form>
</main>
</body>
</html>
